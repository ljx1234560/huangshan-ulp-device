services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velapet
      POSTGRES_USER: velapet
      POSTGRES_PASSWORD: velapet_dev
    ports:
      - "5432:5432"
    volumes:
      - velapet_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velapet -d velapet"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      VELAPET_ENV: development
      VELAPET_DATABASE_URL: postgresql+psycopg://velapet:velapet_dev@postgres:5432/velapet
      VELAPET_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      VELAPET_COOKIE_SECURE: "false"
      VELAPET_AI_PROVIDER: mock
      VELAPET_SEED_DEMO: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  velapet_postgres:
