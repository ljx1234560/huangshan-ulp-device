services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: velapet
      POSTGRES_USER: velapet
      POSTGRES_PASSWORD: velapet_dev
    ports:
      - "5432:5432"
    volumes:
      - velapet_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velapet -d velapet"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      VELAPET_ENV: development
      VELAPET_DATABASE_URL: postgresql+psycopg://velapet:velapet_dev@postgres:5432/velapet
      VELAPET_ALLOWED_ORIGINS: ${VELAPET_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      VELAPET_COOKIE_SECURE: ${VELAPET_COOKIE_SECURE:-false}
      VELAPET_ACCESS_SESSION_MINUTES: ${VELAPET_ACCESS_SESSION_MINUTES:-30}
      VELAPET_REFRESH_SESSION_DAYS: ${VELAPET_REFRESH_SESSION_DAYS:-14}
      VELAPET_TEXT_AI_PROVIDER: ${VELAPET_TEXT_AI_PROVIDER:-mock}
      VELAPET_TEXT_AI_API_KEY: ${VELAPET_TEXT_AI_API_KEY:-}
      VELAPET_TEXT_AI_BASE_URL: ${VELAPET_TEXT_AI_BASE_URL:-https://api.deepseek.com}
      VELAPET_TEXT_AI_MODEL: ${VELAPET_TEXT_AI_MODEL:-}
      VELAPET_TEXT_AI_TIMEOUT_SECONDS: ${VELAPET_TEXT_AI_TIMEOUT_SECONDS:-20}
      VELAPET_TEXT_AI_SERVICE_URL: ${VELAPET_TEXT_AI_SERVICE_URL:-http://127.0.0.1:8010}
      VELAPET_TEXT_AI_DEVICE_TOKEN: ${VELAPET_TEXT_AI_DEVICE_TOKEN:-}
      VELAPET_IMAGE_AI_PROVIDER: ${VELAPET_IMAGE_AI_PROVIDER:-mock}
      VELAPET_IMAGE_AI_API_KEY: ${VELAPET_IMAGE_AI_API_KEY:-}
      VELAPET_IMAGE_AI_BASE_URL: ${VELAPET_IMAGE_AI_BASE_URL:-https://api.openai.com/v1}
      VELAPET_IMAGE_AI_MODEL: ${VELAPET_IMAGE_AI_MODEL:-}
      VELAPET_IMAGE_AI_TIMEOUT_SECONDS: ${VELAPET_IMAGE_AI_TIMEOUT_SECONDS:-120}
      VELAPET_IMAGE_AI_SIZE: ${VELAPET_IMAGE_AI_SIZE:-1024x1024}
      VELAPET_IMAGE_AI_QUALITY: ${VELAPET_IMAGE_AI_QUALITY:-medium}
      VELAPET_IMAGE_AI_OUTPUT_FORMAT: ${VELAPET_IMAGE_AI_OUTPUT_FORMAT:-png}
      VELAPET_IMAGE_AI_BACKGROUND: ${VELAPET_IMAGE_AI_BACKGROUND:-auto}
      VELAPET_IMAGE_AI_RESPONSE_FORMAT: ${VELAPET_IMAGE_AI_RESPONSE_FORMAT:-b64_json}
      VELAPET_IMAGE_AI_WATERMARK: ${VELAPET_IMAGE_AI_WATERMARK:-false}
      VELAPET_IMAGE_STORAGE_DIR: /app/data/pet-images
      VELAPET_IMAGE_MAX_BYTES: ${VELAPET_IMAGE_MAX_BYTES:-10485760}
      VELAPET_IMAGE_DAILY_LIMIT: ${VELAPET_IMAGE_DAILY_LIMIT:-10}
      VELAPET_IMAGE_CONCURRENT_LIMIT: ${VELAPET_IMAGE_CONCURRENT_LIMIT:-1}
      VELAPET_IMAGE_JOB_MAX_ATTEMPTS: ${VELAPET_IMAGE_JOB_MAX_ATTEMPTS:-2}
      VELAPET_IMAGE_JOB_STALE_MINUTES: ${VELAPET_IMAGE_JOB_STALE_MINUTES:-10}
      VELAPET_SEED_DEMO: ${VELAPET_SEED_DEMO:-true}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - velapet_images:/app/data/pet-images

  image-worker:
    build: ./server
    command: ["python", "scripts/image_worker.py"]
    environment:
      VELAPET_ENV: development
      VELAPET_DATABASE_URL: postgresql+psycopg://velapet:velapet_dev@postgres:5432/velapet
      VELAPET_IMAGE_AI_PROVIDER: ${VELAPET_IMAGE_AI_PROVIDER:-mock}
      VELAPET_IMAGE_AI_API_KEY: ${VELAPET_IMAGE_AI_API_KEY:-}
      VELAPET_IMAGE_AI_BASE_URL: ${VELAPET_IMAGE_AI_BASE_URL:-https://api.openai.com/v1}
      VELAPET_IMAGE_AI_MODEL: ${VELAPET_IMAGE_AI_MODEL:-}
      VELAPET_IMAGE_AI_TIMEOUT_SECONDS: ${VELAPET_IMAGE_AI_TIMEOUT_SECONDS:-120}
      VELAPET_IMAGE_AI_SIZE: ${VELAPET_IMAGE_AI_SIZE:-1024x1024}
      VELAPET_IMAGE_AI_QUALITY: ${VELAPET_IMAGE_AI_QUALITY:-medium}
      VELAPET_IMAGE_AI_OUTPUT_FORMAT: ${VELAPET_IMAGE_AI_OUTPUT_FORMAT:-png}
      VELAPET_IMAGE_AI_BACKGROUND: ${VELAPET_IMAGE_AI_BACKGROUND:-auto}
      VELAPET_IMAGE_AI_RESPONSE_FORMAT: ${VELAPET_IMAGE_AI_RESPONSE_FORMAT:-b64_json}
      VELAPET_IMAGE_AI_WATERMARK: ${VELAPET_IMAGE_AI_WATERMARK:-false}
      VELAPET_IMAGE_STORAGE_DIR: /app/data/pet-images
      VELAPET_IMAGE_MAX_BYTES: ${VELAPET_IMAGE_MAX_BYTES:-10485760}
      VELAPET_IMAGE_JOB_MAX_ATTEMPTS: ${VELAPET_IMAGE_JOB_MAX_ATTEMPTS:-2}
      VELAPET_IMAGE_JOB_STALE_MINUTES: ${VELAPET_IMAGE_JOB_STALE_MINUTES:-10}
      VELAPET_SEED_DEMO: "false"
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    volumes:
      - velapet_images:/app/data/pet-images

volumes:
  velapet_postgres:
  velapet_images:
