[project]
name = "velapet-ble-bridge"
version = "0.3.0"
description = "Windows BLE to FastAPI bridge for VelaPet devices"
requires-python = ">=3.11"
dependencies = [
  "bleak>=1.1,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<7"]

[project.scripts]
velapet-bridge = "velapet_bridge.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
